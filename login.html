<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Iniciar sesión en BlackByte." />
  <title>Iniciar sesión — BlackByte</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Full screen background decoration */
    .auth-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .auth-bg-orbital {
      position: absolute;
      bottom: -15%;
      right: -12%;
      width: min(600px, 70vw);
      height: min(600px, 70vw);
      opacity: 0.03;
      color: var(--white);
    }

    .auth-page {
      position: relative;
      z-index: 1;
    }

    /* Divider line inside card */
    .auth-divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    /* Password toggle */
    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      padding-right: 3rem;
    }

    .pw-toggle {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--dim);
      padding: 0.2rem;
      display: flex;
      align-items: center;
      transition: color var(--transition);
    }

    .pw-toggle:hover {
      color: var(--white);
    }

    .pw-toggle svg {
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <a href="index.html" class="btn-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M19 12H5M12 5l-7 7 7 7" />
    </svg>
    <span>Volver</span>
  </a>

  <!-- Background -->
  <div class="auth-bg" aria-hidden="true">
    <svg class="auth-bg-orbital" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="50" cy="50" r="44" />
      <ellipse cx="50" cy="50" rx="44" ry="20" />
      <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(60 50 50)" />
      <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(120 50 50)" />
    </svg>
  </div>

  <!-- Auth page -->
  <main class="auth-page" role="main">

    <!-- Logo -->
    <a href="index.html" class="auth-logo" aria-label="Volver al inicio de BlackByte">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.5" aria-hidden="true">
        <circle cx="50" cy="50" r="44" />
        <ellipse cx="50" cy="50" rx="44" ry="20" />
        <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(60 50 50)" />
        <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(120 50 50)" />
      </svg>
      BLACKBYTE
    </a>

    <!-- Card -->
    <div class="auth-card" role="region" aria-label="Formulario de inicio de sesión">

      <h1>Iniciar sesión</h1>
      <p class="auth-sub">Accedé a tu cuenta de BlackByte.</p>

      <div class="auth-divider"></div>

      <!-- Global error -->
      <p class="form-error" id="global-error" role="alert" aria-live="polite"></p>

      <form id="login-form" novalidate autocomplete="on">

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required
            aria-required="true" />
          <span class="form-error" id="error-email" aria-live="polite"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"
              required aria-required="true" />
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Mostrar contraseña">
              <!-- Eye icon (show) -->
              <svg id="eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Eye-off icon (hide) — hidden by default -->
              <svg id="eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                aria-hidden="true" style="display:none">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <span class="form-error" id="error-password" aria-live="polite"></span>
        </div>

        <button type="submit" class="auth-submit" id="submit-btn">Entrar</button>

      </form>

      <div class="auth-footer-link" style="text-align:center;margin-top:1rem;">
        <a href="forgot-password.html" style="font-size:0.8rem;color:var(--dim);text-decoration:none;transition:color 0.2s;"
           onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='var(--dim)'">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <div class="auth-footer-link">
        ¿No tenés cuenta? <a href="register.html">Registrate</a>
      </div>

    </div>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    /* Redirect if already logged in */
    (function () {
      if (getSession()) window.location.replace('dashboard.html');
    })();

    /* Password toggle */
    const pwToggle = document.getElementById('pw-toggle');
    const pwInput = document.getElementById('password');
    const eyeShow = document.getElementById('eye-show');
    const eyeHide = document.getElementById('eye-hide');

    pwToggle.addEventListener('click', function () {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeShow.style.display = isHidden ? 'none' : '';
      eyeHide.style.display = isHidden ? '' : 'none';
      pwToggle.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    /* Form helpers */
    function showError(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('visible', !!msg);
    }

    function clearErrors() {
      ['error-email', 'error-password', 'global-error'].forEach(id => showError(id, ''));
    }

    /* Login form */
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');

      /* Basic client-side validation */
      let hasError = false;

      if (!email) {
        showError('error-email', 'El email es requerido.');
        hasError = true;
      }

      if (!password) {
        showError('error-password', 'La contraseña es requerida.');
        hasError = true;
      }

      if (hasError) return;

      btn.disabled = true;
      btn.textContent = 'Ingresando…';

      /* Small timeout to let DOM paint the disabled state */
      setTimeout(async function () {
        const result = await login(email, password);

        if (result.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showError('global-error', result.error || 'Error al iniciar sesión.');
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      }, 120);
    });
  </script>
