<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crear cuenta en BlackByte." />
  <title>Crear cuenta — BlackByte</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .auth-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .auth-bg-orbital {
      position: absolute;
      top: -10%;
      left: -12%;
      width: min(550px, 65vw);
      height: min(550px, 65vw);
      opacity: 0.03;
      color: var(--white);
    }

    .auth-page {
      position: relative;
      z-index: 1;
    }

    .auth-divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    .input-wrapper { position: relative; }
    .input-wrapper input { padding-right: 3rem; }

    .pw-toggle {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--dim);
      padding: 0.2rem;
      display: flex;
      align-items: center;
      transition: color var(--transition);
    }

    .pw-toggle:hover { color: var(--white); }
    .pw-toggle svg { width: 16px; height: 16px; pointer-events: none; }

    /* Password strength indicator */
    .pw-strength {
      margin-top: 0.5rem;
      display: flex;
      gap: 4px;
    }

    .pw-strength-bar {
      height: 3px;
      flex: 1;
      border-radius: 2px;
      background: var(--border-mid);
      transition: background 0.3s;
    }

    .pw-strength-bar.weak   { background: #ff6b6b; }
    .pw-strength-bar.medium { background: #ffd166; }
    .pw-strength-bar.strong { background: #06d6a0; }
  </style>
</head>
<body>

  <a href="index.html" class="btn-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    <span>Volver</span>
  </a>

  <!-- Background -->
  <div class="auth-bg" aria-hidden="true">
    <svg class="auth-bg-orbital" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="50" cy="50" r="44"/>
      <ellipse cx="50" cy="50" rx="44" ry="20"/>
      <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(60 50 50)"/>
      <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(120 50 50)"/>
    </svg>
  </div>

  <main class="auth-page" role="main">

    <!-- Logo -->
    <a href="index.html" class="auth-logo" aria-label="Volver al inicio de BlackByte">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.5" aria-hidden="true">
        <circle cx="50" cy="50" r="44"/>
        <ellipse cx="50" cy="50" rx="44" ry="20"/>
        <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(60 50 50)"/>
        <ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(120 50 50)"/>
      </svg>
      BLACKBYTE
    </a>

    <!-- Card -->
    <div class="auth-card" role="region" aria-label="Formulario de registro">

      <h1>Crear cuenta</h1>
      <p class="auth-sub">Registrate y accedé a todos los beneficios.</p>

      <div class="auth-divider"></div>

      <!-- Global error -->
      <p class="form-error" id="global-error" role="alert" aria-live="polite"></p>

      <form id="register-form" novalidate autocomplete="on">

        <!-- Name -->
        <div class="form-group">
          <label for="name">Nombre completo</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Tu nombre"
            autocomplete="name"
            required
            aria-required="true"
          />
          <span class="form-error" id="error-name" aria-live="polite"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="tu@email.com"
            autocomplete="email"
            required
            aria-required="true"
          />
          <span class="form-error" id="error-email" aria-live="polite"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mín. 6 caracteres"
              autocomplete="new-password"
              required
              aria-required="true"
            />
            <button type="button" class="pw-toggle" id="pw-toggle-1" aria-label="Mostrar contraseña">
              <svg id="eye1-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eye1-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <!-- Strength bars -->
          <div class="pw-strength" id="pw-strength" aria-hidden="true">
            <div class="pw-strength-bar" id="bar-1"></div>
            <div class="pw-strength-bar" id="bar-2"></div>
            <div class="pw-strength-bar" id="bar-3"></div>
          </div>
          <span class="form-error" id="error-password" aria-live="polite"></span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-password">Confirmar contraseña</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Repetí tu contraseña"
              autocomplete="new-password"
              required
              aria-required="true"
            />
            <button type="button" class="pw-toggle" id="pw-toggle-2" aria-label="Mostrar contraseña">
              <svg id="eye2-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eye2-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="form-error" id="error-confirm" aria-live="polite"></span>
        </div>

        <button type="submit" class="auth-submit" id="submit-btn">Crear cuenta</button>

      </form>

      <div class="auth-footer-link">
        ¿Ya tenés cuenta? <a href="login.html">Iniciar sesión</a>
      </div>

    </div>

  </main>

  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    /* Redirect if already logged in */
    (function () {
      if (getSession()) window.location.replace('dashboard.html');
    })();

    /* ── Password toggles ─────────────────────────── */
    function makeToggle(btnId, inputId, showId, hideId) {
      const btn   = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      const show  = document.getElementById(showId);
      const hide  = document.getElementById(hideId);
      if (!btn) return;
      btn.addEventListener('click', function () {
        const hidden = input.type === 'password';
        input.type   = hidden ? 'text' : 'password';
        show.style.display = hidden ? 'none' : '';
        hide.style.display = hidden ? ''     : 'none';
        btn.setAttribute('aria-label', hidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
      });
    }

    makeToggle('pw-toggle-1', 'password',         'eye1-show', 'eye1-hide');
    makeToggle('pw-toggle-2', 'confirm-password',  'eye2-show', 'eye2-hide');

    /* ── Password strength ────────────────────────── */
    document.getElementById('password').addEventListener('input', function () {
      const val    = this.value;
      const bars   = [
        document.getElementById('bar-1'),
        document.getElementById('bar-2'),
        document.getElementById('bar-3')
      ];

      /* Reset */
      bars.forEach(b => { b.className = 'pw-strength-bar'; });

      if (!val) return;

      let strength = 0;
      if (val.length >= 6)  strength++;
      if (val.length >= 10) strength++;
      if (/[^a-zA-Z0-9]/.test(val) || /[0-9]/.test(val)) strength++;

      const cls = strength === 1 ? 'weak' : strength === 2 ? 'medium' : 'strong';
      for (let i = 0; i < strength; i++) bars[i].classList.add(cls);
    });

    /* ── Form helpers ─────────────────────────────── */
    function showError(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('visible', !!msg);
    }

    function clearErrors() {
      ['error-name', 'error-email', 'error-password', 'error-confirm', 'global-error']
        .forEach(id => showError(id, ''));
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    /* ── Register form ────────────────────────────── */
    document.getElementById('register-form').addEventListener('submit', function (e) {
      e.preventDefault();
      clearErrors();

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm-password').value;
      const btn      = document.getElementById('submit-btn');

      let hasError = false;

      if (!name) {
        showError('error-name', 'El nombre es requerido.');
        hasError = true;
      }

      if (!email) {
        showError('error-email', 'El email es requerido.');
        hasError = true;
      } else if (!isValidEmail(email)) {
        showError('error-email', 'El email no es válido.');
        hasError = true;
      }

      if (!password) {
        showError('error-password', 'La contraseña es requerida.');
        hasError = true;
      } else if (password.length < 6) {
        showError('error-password', 'La contraseña debe tener al menos 6 caracteres.');
        hasError = true;
      }

      if (!confirm) {
        showError('error-confirm', 'Confirmá tu contraseña.');
        hasError = true;
      } else if (password !== confirm) {
        showError('error-confirm', 'Las contraseñas no coinciden.');
        hasError = true;
      }

      if (hasError) return;

      btn.disabled    = true;
      btn.textContent = 'Creando cuenta…';

      setTimeout(async function () {
        const result = await register(name, email, password);

        if (result.ok) {
          document.getElementById('register-form').closest('.auth-card').innerHTML = `
            <div style="text-align:center;padding:1rem 0;">
              <div style="font-size:3rem;margin-bottom:1rem;">📧</div>
              <h1 style="font-family:'Playfair Display',serif;font-size:2rem;margin-bottom:0.75rem;">Verificá tu email</h1>
              <p style="font-size:0.85rem;color:var(--dim);line-height:1.75;margin-bottom:2rem;">
                Te enviamos un email a <strong style="color:var(--white);">${email}</strong>.<br>
                Hacé click en el enlace para activar tu cuenta.
              </p>
              <a href="login.html" class="btn" style="display:inline-block;">Ir al inicio de sesión</a>
            </div>
          `;
        } else {
          showError('global-error', result.error || 'Error al crear la cuenta.');
          btn.disabled    = false;
          btn.textContent = 'Crear cuenta';
        }
      }, 120);
    });
  </script>
